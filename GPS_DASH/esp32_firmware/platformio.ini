; PlatformIO Project Configuration File
; ESP32 + MPU6050 + Encoder - Serial Output

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Serial Monitor
monitor_speed = 115200

; Upload Settings - Slower for stability
upload_speed = 115200
upload_port = COM9
upload_resetmethod = hw_rts

; Build Settings
build_flags =
    -D CORE_DEBUG_LEVEL=3
    -D CONFIG_ARDUHAL_LOG_COLORS=1

; Library Dependencies
lib_deps =
