<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADAS 3D Navigation - Tesla Style</title>
    
    <!-- MapLibre GL JS -->
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
    
    <!-- Custom Styles -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style_3d_nav.css') }}">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Main Dashboard Container -->
    <div class="dashboard-container">
        
        <!-- Full Screen Map -->
        <div id="map"></div>
        
        <!-- Top HUD Bar -->
        <header class="hud-header">
            <div class="hud-left">
                <div class="logo">
                    <svg class="logo-icon" viewBox="0 0 40 40" fill="none">
                        <circle cx="20" cy="20" r="18" stroke="currentColor" stroke-width="2"/>
                        <path d="M20 8 L20 20 L28 28" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        <circle cx="20" cy="20" r="3" fill="currentColor"/>
                    </svg>
                    <span>ADAS 3D NAV</span>
                </div>
            </div>
            <div class="hud-center">
                <div class="status-indicator" id="connectionStatus">
                    <span class="status-dot"></span>
                    <span class="status-text">CONNECTING</span>
                </div>
            </div>
            <div class="hud-right">
                <div class="time-display" id="currentTime">--:--:--</div>
            </div>
        </header>
        
        <!-- Left Panel - Speed & Navigation -->
        <aside class="side-panel left-panel">
            <!-- Speed Display -->
            <div class="speed-panel">
                <div class="speed-value" id="speedValue">0</div>
                <div class="speed-unit">KM/H</div>
                <div class="speed-bar-container">
                    <div class="speed-bar-fill" id="speedBar"></div>
                </div>
            </div>
            
            <!-- Heading Compass -->
            <div class="compass-panel">
                <div class="compass-ring" id="compassRing">
                    <div class="compass-markings">
                        <span class="compass-dir n">N</span>
                        <span class="compass-dir e">E</span>
                        <span class="compass-dir s">S</span>
                        <span class="compass-dir w">W</span>
                    </div>
                    <div class="compass-arrow"></div>
                </div>
                <div class="heading-value" id="headingValue">N</div>
                <div class="heading-label">HEADING</div>
            </div>
            
            <!-- GPS Data -->
            <div class="gps-data-panel">
                <div class="data-row">
                    <span class="data-label">LATITUDE</span>
                    <span class="data-value" id="latitude">--.------</span>
                </div>
                <div class="data-row">
                    <span class="data-label">LONGITUDE</span>
                    <span class="data-value" id="longitude">--.------</span>
                </div>
                <div class="data-row">
                    <span class="data-label">ALTITUDE</span>
                    <span class="data-value" id="altitude">--- m</span>
                </div>
                <div class="data-row">
                    <span class="data-label">SATELLITES</span>
                    <span class="data-value" id="satellites">--</span>
                </div>
                <div class="data-row">
                    <span class="data-label">ACCURACY</span>
                    <span class="data-value" id="accuracy">--.- m</span>
                </div>
            </div>
            
            <!-- Controls -->
            <div class="control-panel">
                <button class="btn btn-primary" id="btnStartSim">START NAVIGATION</button>
                <button class="btn btn-secondary" id="btnStopSim" disabled>STOP</button>
                <div class="simulation-toggle">
                    <label class="toggle-label">
                        <input type="checkbox" id="simulationMode">
                        <span class="toggle-slider"></span>
                        <span class="toggle-text">AUTO SIMULATION</span>
                    </label>
                </div>
            </div>
        </aside>
        
        <!-- Right Panel - Trip Info -->
        <aside class="side-panel right-panel">
            <!-- Trip Computer -->
            <div class="trip-panel">
                <div class="panel-title">TRIP COMPUTER</div>
                <div class="trip-item">
                    <span class="trip-label">TIME</span>
                    <span class="trip-value" id="tripTime">00:00:00</span>
                </div>
                <div class="trip-item">
                    <span class="trip-label">DISTANCE</span>
                    <span class="trip-value" id="tripDistance">0.00 km</span>
                </div>
                <div class="trip-item">
                    <span class="trip-label">AVG SPEED</span>
                    <span class="trip-value" id="avgSpeed">0 km/h</span>
                </div>
            </div>
            
            <!-- Map Controls -->
            <div class="map-control-panel">
                <div class="panel-title">MAP VIEW</div>
                <button class="map-btn" id="btnTiltUp" title="Tilt Up">⌃</button>
                <button class="map-btn" id="btnTiltDown" title="Tilt Down">⌄</button>
                <button class="map-btn" id="btnZoomIn" title="Zoom In">+</button>
                <button class="map-btn" id="btnZoomOut" title="Zoom Out">−</button>
                <button class="map-btn" id="btnCenter" title="Center">⌖</button>
                <button class="map-btn" id="btn3D" title="Toggle 3D">◩</button>
            </div>
            
            <!-- Alert Panel -->
            <div class="alert-panel" id="alertPanel">
                <div class="alert-header">
                    <span>NOTIFICATIONS</span>
                </div>
                <div class="alert-list" id="alertList">
                    <div class="alert-item info">System Ready</div>
                </div>
            </div>
        </aside>
        
        <!-- Bottom Bar -->
        <footer class="hud-footer">
            <div class="footer-left">
                <span class="mode-indicator active">3D NAVIGATION</span>
            </div>
            <div class="footer-center">
                <div class="signal-strength" id="signalStrength">
                    <span class="signal-label">GPS</span>
                    <div class="signal-bars">
                        <div class="signal-bar"></div>
                        <div class="signal-bar"></div>
                        <div class="signal-bar"></div>
                        <div class="signal-bar"></div>
                    </div>
                </div>
            </div>
            <div class="footer-right">
                <span class="coordinates" id="footerCoords">--.------, --.------</span>
            </div>
        </footer>
    </div>
    
    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
        <div class="loading-text">LOADING 3D MAP...</div>
    </div>
    
    <script src="{{ url_for('static', filename='script_3d_nav.js') }}"></script>
</body>
</html>
